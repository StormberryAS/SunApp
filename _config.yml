# GitHub Pages serves sun.stormberry.as from this repository root.
#
# Everything listed below is source, tooling or build input that must never be
# published. Without this file Pages would serve the whole Android tree,
# including gradlew, the Gradle wrapper jar and local.properties.
#
# Added 2026-08-21, before the android/ directory existed, precisely so that
# scaffolding it cannot leak.
exclude:
  - android/
  - tools/
  - data/
  - .venv/
  - venv/
  - test.js
  - zapstore.yaml
  - README.md
  - LICENSE
  - update_cities.py
  - fastlane/
  - NOTICE
  - DISCLAIMER.md
  - bump_assets.py
# bump_assets.py added 2026-09-05: the estate-wide sweep found it still reachable from
# the live site. tools/ was already excluded here.
# Type-checking tooling, added 2026-10-16, then the TypeScript move (21 October 2026, on
# EclipseTracker's model): the TypeScript sources (ts/), the tests (tests/), the package files,
# .npmrc, tsconfig.json and the installed compiler (node_modules/, never committed) are excluded.
# tools/ (which now also holds build-ts.sh and gen-solar-golden.ts) was excluded already. The page
# loads only the compiled app.js, which IS published. jsconfig.json and types/ are gone: the
# declarations moved into ts/.
  - node_modules/
  - package.json
  - package-lock.json
  - .npmrc
  - tsconfig.json
  - ts/
  - tests/
