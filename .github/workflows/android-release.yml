name: Android release

# Tagged android-v* only. The repo also serves the web app at sun.stormberry.as,
# so the prefix keeps app releases from colliding with anything the site tags.
on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:

permissions:
  contents: write        # create the release
  id-token: write        # sign the provenance attestation
  attestations: write    # publish it

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # Runs before Gradle deliberately. The APK bundles data/cities.tsv while the
      # website serves cities.js, and both come out of one generator run. If they
      # have drifted, that is a data bug worth failing on before spending five
      # minutes compiling.
      - name: Check city catalogue parity
        run: python3 tools/check-city-parity.py

      # The runner ships an Android SDK, but not necessarily platform 37.1, and its
      # bundled sdkmanager may be too old to know that package exists. Refresh
      # cmdline-tools first, then install, and let the output show if it fails.
      - name: Install SDK packages the runner may not have
        working-directory: android
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "cmdline-tools;latest" > /dev/null
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.1" "build-tools;36.0.0"

      # The keystore is decoded into RUNNER_TEMP, which sits outside the workspace,
      # so no artifact glob or accidental `git add` can ever pick it up.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # Unit tests gate the release, they are not just a dev-loop convenience. The
      # golden corpus is the entire safety net for the hand-written SunCalc port,
      # and the occurrence tests are the only thing standing between a bad offset
      # and an alarm at the wrong hour.
      - name: Build signed release APK
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease

      # Fails the release if signing silently fell back to unsigned, and diffs the
      # declared permissions against the committed allowlist.
      - name: Verify signature and permissions
        working-directory: android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk

          # Newest build-tools that actually carries what this step needs. Taking the
          # highest version blindly is not safe: a partial download, or a release that
          # drops the legacy aapt, would fail the build for a reason that has nothing
          # to do with the APK.
          BUILD_TOOLS=""
          for d in $(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -Vr); do
            if [ -x "$d/apksigner" ] && { [ -x "$d/aapt2" ] || [ -x "$d/aapt" ]; }; then
              BUILD_TOOLS="${d%/}"
              break
            fi
          done
          if [ -z "$BUILD_TOOLS" ]; then
            echo "::error::no build-tools install carries both apksigner and aapt/aapt2"
            ls -d "$ANDROID_HOME"/build-tools/*/ || true
            exit 1
          fi
          echo "Using $BUILD_TOOLS"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"

          AAPT="$BUILD_TOOLS/aapt2"
          [ -x "$AAPT" ] || AAPT="$BUILD_TOOLS/aapt"

          # Diff in BOTH directions. An unexpected permission is the obvious failure,
          # but a listed one that has vanished matters just as much: a missing
          # RECEIVE_BOOT_COMPLETED would not break the build, it would quietly make
          # every alarm die at the next reboot.
          "$AAPT" dump permissions "$APK" \
            | sed -n "s/^uses-permission: name='\([^']*\)'.*/\1/p" \
            | sort -u > /tmp/actual-permissions.txt
          grep -vE '^\s*(#|$)' expected-permissions.txt | sort -u > /tmp/expected-permissions.txt

          if ! diff -u /tmp/expected-permissions.txt /tmp/actual-permissions.txt; then
            echo "::error::declared permissions do not match android/expected-permissions.txt"
            echo "If the change is intended, update that file in the same commit as the manifest."
            exit 1
          fi
          echo "Verified: permissions match the committed allowlist ($(wc -l < /tmp/actual-permissions.txt) entries)."

      - name: Remove keystore
        if: always()
        run: shred -u "$RUNNER_TEMP/release.jks" || rm -f "$RUNNER_TEMP/release.jks"

      # Lets anyone prove this exact binary came out of this repo and this run:
      #   gh attestation verify SunApp-v1.0.0.apk -R StormberryAS/SunApp
      - uses: actions/attest-build-provenance@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          subject-path: android/app/build/outputs/apk/release/app-release.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          # Strips only the "android-" prefix, so the tag android-v1.0.0 yields
          # v1.0.0 and the asset carries the v. Keep this in step with the `match`
          # pattern in zapstore.yaml.
          VERSION="${GITHUB_REF_NAME#android-}"
          cp "$APK" "SunApp-${VERSION}.apk"
          sha256sum "SunApp-${VERSION}.apk" > "SunApp-${VERSION}.apk.sha256"
          gh release create "$GITHUB_REF_NAME" \
            "SunApp-${VERSION}.apk" \
            "SunApp-${VERSION}.apk.sha256" \
            --title "SunApp for Android ${VERSION}" \
            --generate-notes
